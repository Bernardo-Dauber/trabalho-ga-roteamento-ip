frr version 9.1
frr defaults traditional
hostname R1
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf cost 1
!
interface eth2
 ip address 10.0.15.1/30
 ip ospf cost 10
!
interface eth3
 ip address 10.0.14.1/30
 ip ospf cost 100
!
interface eth4
 ip address 192.168.1.1/24
 ip ospf cost 1
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.1
 auto-cost reference-bandwidth 100
 network 10.0.12.0/30 area 0
 network 10.0.15.0/30 area 0
 network 10.0.14.0/30 area 0
 network 192.168.1.0/24 area 0
 network 10.255.0.1/32 area 0
!
line vty
