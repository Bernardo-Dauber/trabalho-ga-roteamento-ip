frr version 9.1
frr defaults traditional
hostname R5
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.5/32
!
interface eth2
 ip address 10.0.15.2/30
 ip ospf cost 10
!
interface eth1
 ip address 10.0.45.2/30
 ip ospf cost 10
!
interface eth3
 ip address 10.0.25.2/30
 ip ospf cost 10
!
interface eth4
 ip address 192.168.5.1/24
 ip ospf cost 1
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.5
 auto-cost reference-bandwidth 100
 network 10.0.15.0/30 area 0
 network 10.0.45.0/30 area 0
 network 10.0.25.0/30 area 0
 network 192.168.5.0/24 area 0
 network 10.255.0.5/32 area 0
!
line vty
