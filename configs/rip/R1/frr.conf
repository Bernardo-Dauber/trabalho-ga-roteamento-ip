frr version 9.1
frr defaults traditional
hostname R1
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.15.1/30
!
interface eth3
 ip address 10.0.14.1/30
!
interface eth4
 ip address 192.168.1.1/24
!
router rip
 version 2
 network 10.0.12.0/30
 network 10.0.15.0/30
 network 10.0.14.0/30
 network 192.168.1.0/24
 network 10.255.0.1/32
 passive-interface eth4
!
line vty
