frr version 9.1
frr defaults traditional
hostname R4
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.4/32
!
interface eth1
 ip address 10.0.34.2/30
!
interface eth2
 ip address 10.0.45.1/30
!
interface eth3
 ip address 10.0.14.2/30
!
interface eth4
 ip address 192.168.4.1/24
!
router rip
 version 2
 network 10.0.34.0/30
 network 10.0.45.0/30
 network 10.0.14.0/30
 network 192.168.4.0/24
 network 10.255.0.4/32
 passive-interface eth4
!
line vty
