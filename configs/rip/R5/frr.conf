frr version 9.1
frr defaults traditional
hostname R5
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.5/32
!
interface eth2
 ip address 10.0.15.2/30
!
interface eth1
 ip address 10.0.45.2/30
!
interface eth3
 ip address 10.0.25.2/30
!
interface eth4
 ip address 192.168.5.1/24
!
router rip
 version 2
 network 10.0.15.0/30
 network 10.0.45.0/30
 network 10.0.25.0/30
 network 192.168.5.0/24
 network 10.255.0.5/32
 passive-interface eth4
!
line vty
