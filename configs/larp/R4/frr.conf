frr version 9.1
frr defaults traditional
hostname R4
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.4/32
!
interface eth1
 ip address 10.0.34.2/30
!
interface eth2
 ip address 10.0.45.1/30
!
interface eth3
 ip address 10.0.14.2/30
!
interface eth4
 ip address 192.168.4.1/24
!
line vty
